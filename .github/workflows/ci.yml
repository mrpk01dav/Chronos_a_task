name: Chronos CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chronos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Run tests (only if a test script exists)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            bun run test
          else
            echo "No 'test' script in package.json - skipping."
          fi

      - name: Production build
        run: bun run build

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Verify Gradle wrapper exists
        run: |
          test -f gradlew || { echo "::error::android/gradlew is missing. Generate it with 'gradle wrapper' and commit gradlew, gradlew.bat and gradle/wrapper/*."; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle/wrapper/gradle-wrapper.jar is missing."; exit 1; }
          chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK and record checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at android/$APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  app-debug.apk" > app/build/outputs/apk/debug/app-debug.apk.sha256
          {
            echo "### Debug APK"
            echo "- Size: ${SIZE} bytes"
            echo "- SHA-256: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chronos-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
